This will set up a fresh environment named `image-class-env` and pull the appropriate PyTorch binaries with CUDA support.

```yaml
name: image-class-env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1
  - pip:
      - transformers
      - datasets
      - evaluate
      - accelerate>=0.21.0
      - timm
      - pandas
      - numpy
      - matplotlib
      - scikit-learn
      - pillow